[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "imessage-downloader"
version = "0.1.0"
description = "Export a private local copy of Messages from macOS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pytypedstream>=0.1,<1",
  "typer>=0.16,<1",
]

[project.scripts]
imessage-download = "imessage_mlx.cli:app"

[project.optional-dependencies]
train = [
    "accelerate>=1.14.0",
    "datasets>=5.0.0",
    "modal>=1.5.2",
    "peft>=0.19.1",
    "torch>=2.13.0",
    "transformers>=5.14.1",
]
personalize = [
    "accelerate>=1.14.0",
    "numpy>=2.4.6",
    "sentence-transformers>=5.7.0",
]
stamp = [
    "accelerate>=1.14.0",
    "datasets>=5.0.0",
    "modal>=1.5.2",
    "numpy>=2.4.6",
    "openai>=2.53.0",
    "peft>=0.19.1",
    "pydantic>=2.13.4",
    "scikit-learn>=1.9.0",
    "sentence-transformers>=5.7.0",
    "torch>=2.13.0",
    "transformers>=5.14.1",
    "trl>=1.9.2",
]

[dependency-groups]
dev = [
  "numpy>=2.4.6",
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/imessage_mlx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
