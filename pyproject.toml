[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "imessage-downloader"
version = "0.1.0"
description = "Export a private local copy of Messages from macOS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pytypedstream>=0.1,<1",
  "typer>=0.16,<1",
]

[project.scripts]
imessage-download = "imessage_mlx.cli:app"

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/imessage_mlx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
