name: model-rewrite-290k
task: rewrite
objective: target_only
vocab_size: 2048
hidden_size: 64
num_layers: 3
num_heads: 4
intermediate_size: 192
max_sequence_length: 256
dropout: 0.0
tie_embeddings: true
batch_size: 32
epochs: 20
learning_rate: 0.0003
minimum_learning_rate: 0.00003
weight_decay: 0.1
gradient_clip: 1.0
warmup_steps: 100
evaluation_interval: 250
checkpoint_interval: 500
early_stopping_patience: 5
seed: 42
